<!DOCTYPE html>
<html>
<head>
    <title>Custom Video Player</title>
    <style>
        .player {
            max-width: 750px;
            margin: 20px auto;
            border: 2px solid #333;
            position: relative;
        }

        .viewer {
            width: 100%;
        }

        .player__controls {
            display: flex;
            align-items: center;
            background: #222;
            padding: 10px;
            gap: 10px;
            color: white;
        }

        .progress {
            flex: 1;
            height: 10px;
            background: #555;
            cursor: pointer;
            position: relative;
        }

        .progress__filled {
            width: 0%;
            height: 100%;
            background: #00ff88;
        }

        .player__button {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        input[type=range] {
            width: 100px;
        }
    </style>
</head>
<body>

<div class="player">

    <video class="viewer"
        src="https://www.w3schools.com/html/mov_bbb.mp4">
    </video>

    <div class="player__controls">

        <button class="player__button toggle">►</button>

        <button class="player__button" data-skip="-10">« 10s</button>

        <button class="player__button" data-skip="25">25s »</button>

        <input type="range" name="volume" min="0" max="1" step="0.05" value="1" class="volume">

        <input type="range" name="playbackRate" min="0.5" max="2" step="0.1" value="1" class="playbackSpeed">

        <div class="progress">
            <div class="progress__filled"></div>
        </div>

    </div>
</div>

<script src="scripts.js"></script>

</body>
</html>
